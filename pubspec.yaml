# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logoherba.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logoherba.png"
    background_color: "#2E7D32"
    theme_color: "#2E7D32"
  windows:
    generate: true
    image_path: "assets/images/logoherba.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logoherba.png"

# Splash Screen Configuration
flutter_native_splash:
  color: "#2E7D32"
  image: "assets/images/logoherba.png"
  color_dark: "#1B5E20"
  image_dark: "assets/images/logoherba.png"
  android_12:
    image: "assets/images/logoherba.png"
    color: "#2E7D32"
    image_dark: "assets/images/logoherba.png"
    color_dark: "#1B5E20"
  web: false
